name: Pipeline security audit
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    name: Audit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit active workflows
        run: python auditor.py .github/workflows --fail-on medium
      - name: Verify corrected examples
        run: python auditor.py examples/secure.yml examples/advanced-secure.yml --fail-on low
