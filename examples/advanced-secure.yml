name: Corrected Unprivileged Pipeline
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: printf '%s\n' "$USER_INPUT"
        env:
          USER_INPUT: ${{ inputs.command }}
# Removed unused container and external reusable workflow dependencies.
